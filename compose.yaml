# RAG Document Chatbot — backend stack
#
#   backend  - FastAPI + LangChain RAG API. Gemini for chat, Pinecone for
#              embeddings (hosted inference) + vector search.
#              Uploads + the document manifest persist in `chatbot-data`.
#
# No local model server and no local vector DB are needed — both are managed
# services (Google AI + Pinecone). See README for key setup.
#
# Common flows:
#   Start:                 docker compose up --build
#   Offline smoke mode:    PROVIDER=fake docker compose up --build
#   Wipe local data:       docker compose down -v
#
# Overridable via shell env or a repo-root .env (docker compose reads it automatically).

name: rag-chatbot

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rag-chatbot-backend:latest
    restart: unless-stopped
    environment:
      PROVIDER: ${PROVIDER:-gemini}

      # --- Assistant persona ---
      CHATBOT_NAME: ${CHATBOT_NAME:-Lisa}

      # --- Google Gemini (LLM) ---
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-}
      GOOGLE_CHAT_MODEL: ${GOOGLE_CHAT_MODEL:-gemini-2.5-flash}

      # --- Pinecone (embeddings + vector store) ---
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX: ${PINECONE_INDEX:-}
      PINECONE_HOST: ${PINECONE_HOST:-}
      PINECONE_NAMESPACE: ${PINECONE_NAMESPACE:-}
      PINECONE_EMBEDDING_MODEL: ${PINECONE_EMBEDDING_MODEL:-llama-text-embed-v2}

      # --- Server ---
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      TOP_K: ${TOP_K:-4}
      UPLOAD_DIR: /data/uploads
      VECTORSTORE_DIR: /data/vectorstore
    volumes:
      - chatbot-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  chatbot-data:  # uploaded files + document manifest
